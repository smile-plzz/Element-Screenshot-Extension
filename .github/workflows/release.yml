name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm run test:e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: elementshot-packages
          path: releases/*.zip
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releases/*.zip --verify-tag --title "ElementShot $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
