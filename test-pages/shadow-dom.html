<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ElementShot Test: Shadow DOM</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 40px;
      background: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <h1>Shadow DOM &amp; Web Component Tests</h1>
  <p>Test deep inspection of custom elements using open shadow roots.</p>

  <custom-card id="web-component-host"></custom-card>

  <script>
    class CustomCard extends HTMLElement {
      constructor() {
        super();
        const shadow = this.attachShadow({ mode: 'open' });
        shadow.innerHTML = `
          <style>
            .inner-box {
              background: #ecfdf5;
              border: 2px solid #10b981;
              border-radius: 8px;
              padding: 24px;
              max-width: 400px;
              margin-top: 20px;
            }
            .inner-title {
              color: #065f46;
              font-size: 18px;
              font-weight: 700;
              margin-bottom: 8px;
            }
            .inner-btn {
              background: #10b981;
              color: white;
              padding: 6px 14px;
              border-radius: 4px;
              border: none;
              cursor: pointer;
              font-weight: 600;
              margin-top: 12px;
            }
          </style>
          <div class="inner-box" id="shadow-inner-box">
            <div class="inner-title" id="shadow-inner-title">Open Shadow Root Component</div>
            <p>Hovering here should inspect elements inside this open shadow DOM boundary.</p>
            <button class="inner-btn" id="shadow-inner-btn">Shadow Button</button>
          </div>
        `;
      }
    }
    customElements.define('custom-card', CustomCard);
  </script>
</body>
</html>
